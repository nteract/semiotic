name: Consumer toolchain updates

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-toolchain-updates
  cancel-in-progress: true

jobs:
  latest:
    name: Latest webpack, Rspack, and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run dist:prod
      - run: npx playwright install --with-deps chromium
      - name: Check newest consumer compilers without changing repository pins
        run: npm run check:consumer-compatibility -- --latest
      - name: Upload consumer compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latest-consumer-compatibility
          path: test-results/consumer-compatibility/
          if-no-files-found: warn
