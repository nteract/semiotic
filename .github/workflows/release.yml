name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to validate and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  npm-publish-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # A manual recovery run checks out the selected workflow branch here, so
      # the newest preflight can validate an older, still-unpublished tag.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Verify release tag before expensive jobs
        run: |
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          VERSION=$(git show "$RELEASE_TAG:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          EXPECTED_TAG="v${VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag mismatch: expected $EXPECTED_TAG for package.json version $VERSION, got $RELEASE_TAG"
            exit 1
          fi
          TAGGED_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$TAGGED_SHA" origin/main; then
            echo "Release tag $RELEASE_TAG points to $TAGGED_SHA, which is not merged into origin/main"
            exit 1
          fi
          echo "Verified $RELEASE_TAG at $TAGGED_SHA"

      # Unlike npm publish --dry-run, this exchange proves npm authorizes this
      # repository and workflow. The short-lived token is immediately discarded.
      - name: Verify npm trusted-publisher authentication
        run: node scripts/check-npm-trusted-publisher.mjs

  docs-examples:
    needs: npm-publish-preflight
    name: Docs examples (Chromium)
    runs-on: ubuntu-latest
    # The suite is serial to keep source-route behavior deterministic. Give
    # legitimate cold transforms room to finish, but bound a stalled Vite or
    # browser worker so publication cannot wait indefinitely.
    timeout-minutes: 25
    # Authored example routes use their own Vite/source-alias server and test
    # executable behavior rather than comparing baselines. Visual, browser,
    # machine, and performance baselines remain PR gates only.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/semiotic-docker-config

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The pinned Playwright image supplies browsers and OS dependencies.
      # Keep release validation independent of Ubuntu package mirror updates.
      - name: Run docs example source tests
        run: npm run test:examples:source

      - name: Upload local docs example contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-docs-example-local-contract-evidence
          path: test-results/**/docs-example-local-contract-evidence.v2.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload docs example test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-report-docs-examples
          path: |
            test-results/
            integration-tests/test-results/
          retention-days: 7

  publish:
    needs: docs-examples
    runs-on: ubuntu-latest
    environment: release
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.tag }}
    permissions:
      contents: read
      # Required for npm trusted publishing and provenance. GitHub Release
      # writes happen in a separate least-privilege job below.
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.7.9
      MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      # Node 22 currently bundles npm 10, but trusted publishing requires npm
      # >=11.5.1. Pin the supported CLI instead of inheriting runner drift.
      - name: Install trusted-publishing npm CLI
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          test "$(npm --version)" = "11.6.2"

      - name: Verify release tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag mismatch: expected $EXPECTED_TAG for package.json version $VERSION, got $RELEASE_TAG"
            exit 1
          fi
          echo "Verified release tag $EXPECTED_TAG"

      - name: Verify tagged commit is merged into main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAGGED_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$TAGGED_SHA" origin/main; then
            echo "Release tag $RELEASE_TAG points to $TAGGED_SHA, which is not merged into origin/main"
            exit 1
          fi
          echo "Verified $TAGGED_SHA is an ancestor of origin/main"

      - name: Install dependencies
        run: npm ci

      - name: Audit the release dependency graph
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate

      - name: Check MCP Registry metadata and current live release
        run: |
          npm run check:mcp-registry
          npm run check:mcp-registry-live -- --allow-stale-remote

      - name: Install the official mcp-publisher validator
        run: |
          ARCHIVE="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          BIN_DIR="$RUNNER_TEMP/mcp-publisher-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "$ARCHIVE"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          mkdir -p "$BIN_DIR"
          tar -xzf "$ARCHIVE" -C "$BIN_DIR" mcp-publisher
          chmod 0755 "$BIN_DIR/mcp-publisher"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/mcp-publisher" --help

      - name: Validate MCP Registry metadata before npm publication
        run: mcp-publisher validate

      - name: Install the release browser runtime
        run: npx playwright install --with-deps chromium

      # Use the selected tag's canonical release command, but remove PR-owned
      # baselines in workflow code so a manual recovery of an older tag also
      # receives the current publish policy. Deterministic checks still fail
      # closed before the immutable artifact is frozen.
      - name: Run deterministic publish gate
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process")
          const { scripts } = require("./package.json")

          const prOnlyBaselines = new Set([
            "npm run check:visual-baseline-capabilities",
            "npm run check:cold-consumer",
            "npm run check:machine-baseline",
            "npm run check:browser-baseline",
          ])
          const commands = scripts["release:check"]
            .split(" && ")
            .filter((command) => !prOnlyBaselines.has(command))

          for (const command of commands) {
            console.log(`\n> ${command}`)
            const result = spawnSync(command, {
              cwd: process.cwd(),
              shell: true,
              stdio: "inherit",
            })
            if (result.status !== 0) process.exit(result.status || 1)
          }
          NODE

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if echo "$VERSION" | grep -qE '[-](alpha|beta|rc)'; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Construct one archive after every build/gate. All subsequent smoke,
      # checksum/SBOM evidence, dry-run, and publication steps use this exact
      # file; publishing the checkout would silently create a second archive.
      - name: Create immutable release artifact
        id: release-artifact
        run: |
          OUT_DIR="$RUNNER_TEMP/semiotic-release-artifact"
          npm run release:artifact -- --out-dir "$OUT_DIR"
          node scripts/create-release-artifact.mjs --out-dir "$OUT_DIR" --verify
          MANIFEST=$(find "$OUT_DIR" -maxdepth 1 -name '*.provenance.json' -print -quit)
          TARBALL=$(node -e "const fs=require('fs'); const path=require('path'); const manifest=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(path.join(path.dirname(process.argv[1]), manifest.tarball.file))" "$MANIFEST")
          INTEGRITY=$(node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(manifest.tarball.integrity)" "$MANIFEST")
          echo "directory=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semiotic-${{ env.RELEASE_TAG }}-release-artifact
          path: ${{ steps.release-artifact.outputs.directory }}
          if-no-files-found: error

      - name: Pack-and-import smoke test (exact tarball)
        run: npm run check:pack -- --tarball "${{ steps.release-artifact.outputs.tarball }}"

      - name: "Release diagnostics: packed cold-consumer baseline"
        run: npm run check:cold-consumer -- --tarball "${{ steps.release-artifact.outputs.tarball }}"
        continue-on-error: true

      - name: "Release diagnostics: packed machine baseline"
        run: npm run check:machine-baseline -- --tarball "${{ steps.release-artifact.outputs.tarball }}"
        continue-on-error: true

      - name: Reverify immutable release artifact before publication
        run: node scripts/create-release-artifact.mjs --out-dir "${{ steps.release-artifact.outputs.directory }}" --verify

      - name: "Release diagnostics: coverage-risk"
        run: npm run check:coverage-risk
        continue-on-error: true

      - name: "Release diagnostics: visual baseline capabilities"
        run: npm run check:visual-baseline-capabilities
        continue-on-error: true

      - name: "Release diagnostics: deployment lockfile"
        run: npm run check:cloud-run-lock
        continue-on-error: true

      - name: "Release diagnostics: benchmarks versus previous tag"
        run: npm run bench:release-vs-previous
        continue-on-error: true

      - name: Check whether this exact version is already published
        id: published-artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_INTEGRITY=$(npm view "semiotic@${VERSION}" dist.integrity 2>/dev/null || true)
          if [ -z "$PUBLISHED_INTEGRITY" ]; then
            echo "already-published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUBLISHED_INTEGRITY" != "${{ steps.release-artifact.outputs.integrity }}" ]; then
            echo "semiotic@${VERSION} already exists with different integrity"
            echo "Expected: ${{ steps.release-artifact.outputs.integrity }}"
            echo "Published: $PUBLISHED_INTEGRITY"
            exit 1
          fi
          echo "semiotic@${VERSION} already has the expected integrity; treating this as an idempotent rerun"
          echo "already-published=true" >> "$GITHUB_OUTPUT"

      - name: Dry-run publish exact artifact
        if: steps.published-artifact.outputs.already-published != 'true'
        run: npm publish "${{ steps.release-artifact.outputs.tarball }}" --dry-run --access public --tag ${{ steps.dist-tag.outputs.tag }} --registry=https://registry.npmjs.org

      - name: Publish exact artifact to npm
        if: steps.published-artifact.outputs.already-published != 'true'
        run: npm publish "${{ steps.release-artifact.outputs.tarball }}" --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }} --registry=https://registry.npmjs.org

      - name: Post-publish smoke test
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${{ steps.dist-tag.outputs.tag }}
          echo "Waiting for npm to propagate semiotic@${VERSION}..."
          for i in 1 2 3 4 5; do
            PUBLISHED=$(npm view semiotic@${VERSION} version 2>/dev/null || echo "")
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "Package available on npm"
              break
            fi
            echo "Attempt $i: not yet available, waiting 15s..."
            sleep 15
          done
          if [ "$PUBLISHED" != "$VERSION" ]; then
            echo "Package was not visible on npm registry after 75s"
            exit 1
          fi

          EXPECTED_INTEGRITY="${{ steps.release-artifact.outputs.integrity }}"
          PUBLISHED_INTEGRITY=$(npm view "semiotic@${VERSION}" dist.integrity)
          if [ "$PUBLISHED_INTEGRITY" != "$EXPECTED_INTEGRITY" ]; then
            echo "Published package integrity does not match the immutable release artifact"
            echo "Expected: $EXPECTED_INTEGRITY"
            echo "Published: $PUBLISHED_INTEGRITY"
            exit 1
          fi
          echo "Published npm integrity matches the immutable release artifact"

          # Install in a temp project and verify imports
          CONSUMER_DIR=$(mktemp -d)
          cd "$CONSUMER_DIR"
          npm init -y > /dev/null 2>&1
          npm install --ignore-scripts --registry=https://registry.npmjs.org \
            semiotic@${VERSION} react@19.2.0 react-dom@19.2.0 > /dev/null 2>&1

          node -e "
            const assert = require('assert');
            // Main entry
            const s = require('semiotic');
            assert(s.BarChart, 'BarChart not exported from semiotic');
            assert(s.LineChart, 'LineChart not exported from semiotic');
            assert(s.ForceDirectedGraph, 'ForceDirectedGraph not exported from semiotic');
            // Sub-path entries
            const xy = require('semiotic/xy');
            assert(xy.LineChart, 'LineChart not exported from semiotic/xy');
            const ord = require('semiotic/ordinal');
            assert(ord.BarChart, 'BarChart not exported from semiotic/ordinal');
            const net = require('semiotic/network');
            assert(net.SankeyDiagram, 'SankeyDiagram not exported from semiotic/network');
            const rt = require('semiotic/realtime');
            assert(rt.RealtimeLineChart, 'RealtimeLineChart not exported from semiotic/realtime');
            const srv = require('semiotic/server');
            assert(srv.renderChart, 'renderChart not exported from semiotic/server');
            const themes = require('semiotic/themes');
            assert(themes.resolveThemePreset, 'resolveThemePreset not exported from semiotic/themes');
            const utils = require('semiotic/utils');
            assert(utils.validateProps, 'validateProps not exported from semiotic/utils');
            console.log('All smoke tests passed — 8 entry points verified');
          "
          rm -rf "$CONSUMER_DIR"

      - name: Verify published package registry provenance metadata
        env:
          EXPECTED_INTEGRITY: ${{ steps.release-artifact.outputs.integrity }}
        run: |
          export VERSION=$(node -p "require('./package.json').version")
          node - <<'NODE'
            const { execSync } = require("node:child_process")

            const packageName = "semiotic"
            const version = process.env.VERSION
            const expectedIntegrity = process.env.EXPECTED_INTEGRITY

            const payload = execSync(`npm view ${packageName}@${version} --json`, {
              encoding: "utf8",
            })
            const manifest = JSON.parse(payload)
            const dist = manifest.dist || {}

            if (dist.integrity !== expectedIntegrity) {
              throw new Error(`Published dist.integrity (${dist.integrity}) does not match expected integrity (${expectedIntegrity})`)
            }

            const asArray = (value) => (Array.isArray(value) ? value : value ? [value] : [])
            const signatures = asArray(dist.signatures)
            const attestations = asArray(dist.attestations)

            if (signatures.length === 0) {
              throw new Error("Published package is missing dist.signatures")
            }
            if (attestations.length === 0) {
              throw new Error("Published package is missing dist.attestations")
            }
            console.log(`Verified registry provenance for ${packageName}@${version}: ${signatures.length} signature(s), ${attestations.length} attestation(s)`)
          NODE

      - name: Prepare exact stable Cloud Run source
        if: steps.dist-tag.outputs.tag == 'latest'
        id: cloud-run-source
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT_DIR="$RUNNER_TEMP/semiotic-${VERSION}-cloud-run-source"
          npm run prepare:cloud-run-release -- \
            --version "$VERSION" \
            --expected-integrity "${{ steps.release-artifact.outputs.integrity }}" \
            --output-dir "$OUT_DIR"
          echo "directory=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload exact stable Cloud Run source
        if: steps.dist-tag.outputs.tag == 'latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semiotic-${{ env.RELEASE_TAG }}-cloud-run-source
          path: ${{ steps.cloud-run-source.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download immutable release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: semiotic-${{ env.RELEASE_TAG }}-release-artifact
          path: release-artifact

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE="$(mktemp)"
          awk -v ver="$VERSION" '
            BEGIN { flag = 0 }
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; updating in place"
            if [ -s "$NOTES_FILE" ]; then
              gh release edit "$RELEASE_TAG" \
                --title "Semiotic $RELEASE_TAG" \
                --notes-file "$NOTES_FILE"
            else
              gh release edit "$RELEASE_TAG" --title "Semiotic $RELEASE_TAG"
            fi
          elif [ -s "$NOTES_FILE" ]; then
            gh release create "$RELEASE_TAG" \
              --title "Semiotic $RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              --title "Semiotic $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$RELEASE_TAG" release-artifact/* --clobber
          rm -f "$NOTES_FILE"

  deploy-stable-mcp:
    name: Deploy exact package to stable MCP
    needs: publish
    if: needs.publish.outputs.dist_tag == 'latest'
    runs-on: ubuntu-latest
    environment:
      name: stable-mcp
      url: https://semiotic-mcp-server-481507046413.us-west1.run.app
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_RUN_PROJECT: semiotic-mcp
      CLOUD_RUN_REGION: us-west1
      CLOUD_RUN_SERVICE: semiotic-mcp-server
      CLOUD_RUN_HOST: semiotic-mcp-server-481507046413.us-west1.run.app

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Download exact Cloud Run source
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: semiotic-${{ env.RELEASE_TAG }}-cloud-run-source
          path: ${{ runner.temp }}/semiotic-cloud-run-source

      - name: Require stable deployment identity configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          RELEASE_SERVICE_ACCOUNT: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$WORKLOAD_IDENTITY_PROVIDER" || {
            echo "stable-mcp environment secret GCP_WORKLOAD_IDENTITY_PROVIDER is required"
            exit 1
          }
          test -n "$RELEASE_SERVICE_ACCOUNT" || {
            echo "stable-mcp environment secret GCP_RELEASE_SERVICE_ACCOUNT is required"
            exit 1
          }

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}
          project_id: semiotic-mcp

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify downloaded lock and deployment identity
        id: deployment
        env:
          SOURCE_DIR: ${{ runner.temp }}/semiotic-cloud-run-source
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LOCKED_VERSION=$(node -p "require(process.env.SOURCE_DIR + '/package-lock.json').packages['node_modules/semiotic'].version")
          test "$LOCKED_VERSION" = "$VERSION" || {
            echo "Cloud Run source locks semiotic@$LOCKED_VERSION, expected $VERSION"
            exit 1
          }
          npm ci --ignore-scripts --prefix "$SOURCE_DIR"
          INSTALLED_VERSION=$(node -p "require(process.env.SOURCE_DIR + '/node_modules/semiotic/package.json').version")
          test "$INSTALLED_VERSION" = "$VERSION" || {
            echo "Cloud Run source installed semiotic@$INSTALLED_VERSION, expected $VERSION"
            exit 1
          }
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_BUILT_AT=$(node -e 'process.stdout.write(new Date(process.argv[1]).toISOString())' "$(git show -s --format=%cI HEAD)")
          RELEASE_LABEL=$(node -e 'process.stdout.write(process.argv[1].toLowerCase().replace(/[^a-z0-9_-]/g, "-"))' "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "built-at=$RELEASE_BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "release-label=$RELEASE_LABEL" >> "$GITHUB_OUTPUT"

      - name: Deploy stable Cloud Run revision from exact source
        env:
          SOURCE_DIR: ${{ runner.temp }}/semiotic-cloud-run-source
          VERSION: ${{ steps.deployment.outputs.version }}
          RELEASE_SHA: ${{ steps.deployment.outputs.sha }}
          RELEASE_BUILT_AT: ${{ steps.deployment.outputs.built-at }}
          RELEASE_LABEL: ${{ steps.deployment.outputs.release-label }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source "$SOURCE_DIR" \
            --project "$CLOUD_RUN_PROJECT" \
            --region "$CLOUD_RUN_REGION" \
            --allow-unauthenticated \
            --memory 1Gi \
            --quiet \
            --update-labels "commit-sha=${RELEASE_SHA},managed-by=github-release,release-version=${RELEASE_LABEL}" \
            --remove-labels "gcb-build-id,gcb-trigger-id,gcb-trigger-region" \
            --update-env-vars "MCP_ALLOWED_HOSTS=${CLOUD_RUN_HOST},SEMIOTIC_DEPLOYMENT_CHANNEL=stable,SEMIOTIC_GIT_SHA=${RELEASE_SHA},SEMIOTIC_BUILD_ID=release-v${VERSION},SEMIOTIC_BUILD_TIME=${RELEASE_BUILT_AT}"

          DEPLOYED_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$CLOUD_RUN_PROJECT" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.url)')
          test -n "$DEPLOYED_URL" || {
            echo "Cloud Run did not report a service URL"
            exit 1
          }
          # Cloud Run can report its canonical a.run.app URL here while the
          # configured legacy run.app hostname remains the public stable URL.
          # The following job verifies that public hostname and the release
          # identity after the deployment is complete.
          echo "Cloud Run service URL: $DEPLOYED_URL"

  verify-stable-mcp:
    name: Verify stable MCP release identity
    needs: [publish, deploy-stable-mcp]
    if: needs.publish.outputs.dist_tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Require live stable health and MCP identity to match the release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_SHA=$(git rev-parse HEAD)
          node scripts/smoke-hosted-mcp.mjs \
            --endpoint https://semiotic-mcp-server-481507046413.us-west1.run.app \
            --expected-channel stable \
            --expected-package-version "$VERSION" \
            --expected-sha "$RELEASE_SHA" \
            --expected-build-id "release-v${VERSION}" \
            --timeout-ms 300000

  publish-mcp-registry:
    name: Publish exact MCP Registry metadata
    needs: [publish, verify-stable-mcp]
    if: needs.publish.outputs.dist_tag == 'latest'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
