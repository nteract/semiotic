name: Semiotic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Keep deterministic source and generated-artifact failures ahead of every
  # expensive test path. Browser jobs wait only for this lane, rather than for
  # production bundle measurement and package-consumer checks.
  fast-contracts:
    name: Preflight gates (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check source policy and repository lints
        run: |
          npm run check:router-alignment
          npm run check:playwright-alignment
          npm run lint
          npm run check:custom-lints
          npm run check:file-size
          npm run check:test-quality

      - name: Check chart and docs contract drift
        run: |
          npm run check:chart-specs
          npm run check:capabilities
          npm run check:visual-baseline-capabilities
          npm run check:docs-coverage
          npm run check:docs-example-integrity
          npm run check:docs-prop-tables
          npm run check:docs-playground-controls

      - name: Check AI, SSR, and authored documentation drift
        run: |
          npm run check:llms
          npm run check:blog-entries
          npm run check:ai-reference-coverage
          npm run check:context7
          npm run check:mcp-registry
          npm run check:surface
          npm run check:ai-surface
          npm run check:ai-contracts
          npm run check:ai-instructions
          npm run check:ssr
          npm run check:jsdoc-coverage
          npm run check:ai-examples-coverage
          npm run check:protected-doc-boundaries

  # Vitest's blob reporter carries each shard's test results and V8 coverage
  # map. Thresholds are disabled only while producing these partial maps and
  # are enforced by the merged coverage job below.
  coverage-shards:
    name: Coverage shard ${{ matrix.shard }}/2 (Node 22)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build test artifacts
        run: |
          npm run dist
          npm run build:mcp

      - name: Run coverage shard
        env:
          SEMIOTIC_COVERAGE_SHARD: "true"
        run: >-
          npm run test:coverage:shard -- --shard=${{ matrix.shard }}/2
          --outputFile.blob=vitest-reports/blob-${{ matrix.shard }}-2.json

      - name: Upload coverage shard
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: vitest-reports/*.json
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Merged coverage gate (Node 22)
    runs-on: ubuntu-latest
    needs: coverage-shards

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download coverage shards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-shard-*
          path: vitest-reports
          merge-multiple: true

      - name: Merge reports and enforce coverage policy
        run: npm run test:coverage:merge

  # Build/type/deployment contracts are independent from the coverage and docs
  # critical paths, so a failure in one lane is reported without hiding work in
  # the others.
  full-contracts:
    name: Build, type, and API contracts (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check committed MCP bundle
        run: npm run check:mcp-bundle

      - name: Build library
        run: npm run dist

      - name: Build MCP server
        run: npm run build:mcp

      - name: Check Cloud Run deployment manifest
        run: npm run check:cloud-run-manifest

      - name: Check repository-built nightly Cloud Run deployment
        run: npm run check:cloud-run-nightly

      - name: Test nightly deployment config and hosted smoke runner
        run: |
          npm run test:cloud-run-nightly
          npm run test:smoke-hosted-mcp

      - name: Test protected documentation boundary detection
        run: npm run test:protected-doc-boundaries

      - name: Test release infrastructure helpers
        run: npm run test:release-infrastructure

      - name: Run type check
        run: npm run typescript

      - name: Run test type check
        run: npm run typescript:tests

      - name: Run MCP type check
        run: npm run typescript:mcp

      - name: Check public API surface (no breaking changes)
        run: |
          npm run check:api-surface
          npm run check:api-compat

      - name: Check TypeDoc validation policy
        run: npm run check:typedoc

      - name: Verify TypeScript declarations
        run: |
          for f in dist/semiotic.d.ts dist/semiotic-xy.d.ts dist/semiotic-ordinal.d.ts dist/semiotic-network.d.ts dist/semiotic-geo.d.ts dist/semiotic-realtime.d.ts dist/semiotic-ai.d.ts dist/semiotic-data.d.ts dist/semiotic-server.d.ts dist/semiotic-themes.d.ts; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "All declaration files present"

      - name: Validate canvas stub completeness
        run: |
          # Extract canvas method names used in production renderers
          USED=$(grep -roh 'ctx\.\([a-zA-Z]*\)' src/components/stream/renderers/ | \
            sed 's/ctx\.//' | sort -u | grep -v '^$')
          # Extract stubbed method names from setupTests.ts
          STUBBED=$(grep -oP '"\K[a-zA-Z]+(?=")' src/setupTests.ts | sort -u)
          # Find methods used in renderers but not stubbed
          MISSING=""
          for method in $USED; do
            if ! echo "$STUBBED" | grep -qx "$method"; then
              # Skip property assignments (not methods)
              case "$method" in
                fillStyle|strokeStyle|lineWidth|lineCap|lineJoin|globalAlpha|\
                globalCompositeOperation|font|textAlign|textBaseline|shadowColor|\
                shadowBlur|shadowOffsetX|shadowOffsetY|lineDashOffset|miterLimit|\
                canvas|imageSmoothingEnabled|direction|filter|letterSpacing|\
                fontKerning|fontStretch|fontVariantCaps|textRendering|wordSpacing)
                  ;; # property, not a method — skip
                *)
                  MISSING="$MISSING $method"
                  ;;
              esac
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Canvas methods used in renderers but not stubbed in setupTests.ts:"
            echo "$MISSING"
            echo ""
            echo "Add these to the canvasMethods array in src/setupTests.ts"
            exit 1
          fi
          echo "All canvas methods are stubbed"

  # Own the one expensive production build and reuse it for every minified
  # package, docs, size, and packed-consumer check in this lane.
  docs-package:
    name: Docs and production package checks (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check committed MCP bundle
        run: npm run check:mcp-bundle

      - name: Build production library and MCP server
        run: |
          npm run dist:prod
          npm run build:mcp

      - name: Check production package contracts
        run: npm run check:package-contracts:from-dist

      - name: Build docs from the existing production artifacts
        run: npm run check:website-build:from-dist

      - name: Check machine baseline
        run: npm run check:machine-baseline

      - name: Pack smoke test (verify all entry points resolve)
        run: npm run check:pack

  # Smoke matrix: install, build, typecheck, and unit tests on each
  # supported Node. Catches runtime/engine issues without re-running the
  # full docs/AI contract suite four times.
  testing-matrix:
    name: Smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is covered by the coverage and contract lanes; this matrix
        # covers the other supported engines only.
        node-version: ["24.x", "26.x"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check committed MCP bundle
        run: npm run check:mcp-bundle

      - name: Build library
        run: npm run dist

      - name: Build MCP server
        run: npm run build:mcp

      - name: Run tests
        run: npx vitest run --bail=1

      - name: Run type check
        run: npm run typescript

      - name: Run MCP type check
        run: npm run typescript:mcp

  testing:
    name: testing
    runs-on: ubuntu-latest
    needs:
      - fast-contracts
      - coverage-shards
      - coverage
      - full-contracts
      - docs-package
      - testing-matrix
      - e2e
      - docs-examples
    if: always()
    steps:
      - name: Aggregate matrix result
        run: |
          if [[ "${{ needs['fast-contracts'].result }}" != "success" || "${{ needs['coverage-shards'].result }}" != "success" || "${{ needs['coverage'].result }}" != "success" || "${{ needs['full-contracts'].result }}" != "success" || "${{ needs['docs-package'].result }}" != "success" || "${{ needs['testing-matrix'].result }}" != "success" || "${{ needs['e2e'].result }}" != "success" || "${{ needs['docs-examples'].result }}" != "success" ]]; then
            {
              echo "## Testing failed"
              echo ""
              echo "Preflight gates result: \`${{ needs['fast-contracts'].result }}\`"
              echo "Coverage shards result: \`${{ needs['coverage-shards'].result }}\`"
              echo "Merged coverage result: \`${{ needs['coverage'].result }}\`"
              echo "Build/type/API contracts result: \`${{ needs['full-contracts'].result }}\`"
              echo "Docs/package result: \`${{ needs['docs-package'].result }}\`"
              echo "Smoke matrix result: \`${{ needs['testing-matrix'].result }}\`"
              echo "E2E result: \`${{ needs['e2e'].result }}\`"
              echo "Docs examples result: \`${{ needs['docs-examples'].result }}\`"
              echo ""
              echo "Open the failed job above for the concrete error."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Testing failed::Preflight: ${{ needs['fast-contracts'].result }}; coverage shards: ${{ needs['coverage-shards'].result }}; merged coverage: ${{ needs['coverage'].result }}; contracts: ${{ needs['full-contracts'].result }}; docs/package: ${{ needs['docs-package'].result }}; smoke matrix: ${{ needs['testing-matrix'].result }}; E2E: ${{ needs['e2e'].result }}; docs examples: ${{ needs['docs-examples'].result }}"
            exit 1
          fi

  bench:
    name: Performance regression
    runs-on: ubuntu-latest
    # PR-only: captures main's bench numbers in the same job on the same
    # hardware, then compares the PR's results against them. Avoids the
    # cross-architecture noise that plagues a committed-baseline approach
    # (M-series Mac local capture vs. x86 Linux CI runner produces uniform
    # 60–90% "slowdowns" across every benchmark). On `push: main` there's
    # nothing to compare main against, so the job is skipped.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `bench:pr-vs-main` worktrees `origin/main` to capture a
          # CI-native baseline. Default checkout is shallow to the
          # triggering ref only; full history makes worktree-add reliable
          # without needing extra fetch plumbing.
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compare PR vs main on identical hardware
        run: npm run bench:pr-vs-main

  # The docs source route suite owns a separate Vite server and exercises
  # authored examples rather than the packaged visual harness. Keep it in an
  # independent Chromium job so a slow or failed docs route neither obscures
  # nor delays completion of the three-browser visual E2E matrix.
  docs-examples:
    name: Docs examples (Chromium)
    runs-on: ubuntu-latest
    needs: fast-contracts
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/semiotic-docker-config

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run docs example source tests
        run: npm run test:examples:source

      # The contract test validates this complete local-only capture before it
      # writes the JSON. Retain it for review, but do not compare it against a
      # committed baseline: capture time and runner geometry are per-run facts.
      # It records reduced-motion and browser-emitted visibility behavior without
      # claiming policy-specific animation, performance, or cross-browser parity.
      - name: Upload local docs example contract evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-example-local-contract-evidence
          path: test-results/**/docs-example-local-contract-evidence.v2.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload docs example test artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-docs-examples
          path: |
            test-results/
            integration-tests/test-results/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: fast-contracts
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    # Pin the rendering environment. `ubuntu-latest` is a moving image whose
    # font/freetype stack drifts from committed baselines, causing sub-pixel
    # text-AA diffs across the whole visual suite. Running inside the same
    # Playwright image the baselines are generated in (scripts/run-playwright-
    # linux-bootstrap.mjs) makes CI renders match the baselines exactly and
    # survives future `ubuntu-latest` bumps.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    # In a container job GitHub sets $HOME=/github/home (owned by the image's
    # pwuser) while steps run as root. Firefox refuses to launch unless $HOME
    # is owned by the current user, so point it at root's own home. Chromium
    # and WebKit are unaffected; without this only Firefox fails to start.
    # GitHub can bind an unreadable Docker config below that home. The visual
    # test steps neither build nor pull images, so use a fresh writable config
    # directory instead of emitting a misleading Docker permission warning.
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/semiotic-docker-config

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build library
        run: npm run dist

      - name: Check browser baseline
        run: npm run check:browser-baseline

      - name: Run E2E tests
        # CI is the visual regression gate: a missing baseline is an
        # unreviewed visual contract, not a reason to create one during a
        # pull request. Maintainers can use `test:visual:bootstrap` locally
        # to generate a proposed baseline, then commit it with review.
        run: >-
          npx playwright test --project=${{ matrix.project }}
          --update-snapshots=none

      - name: Upload snapshot baselines
        if: always() && matrix.project == 'chromium'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-snapshots
          path: integration-tests/*.spec.ts-snapshots/
          retention-days: 30

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            test-results/
            integration-tests/test-results/
          retention-days: 7
