name: SSR release evidence

on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Exact published baseline version (for example 3.13.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Test comparison tooling with local artifacts
        run: npm run test:ssr-comparison
      - name: Build current production artifact once
        run: npm run dist:prod
      - name: Compare with explicit published baseline
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: npm run report:ssr-comparison -- --previous "$PREVIOUS_VERSION" --current .
      - name: Retain SSR evidence, including errors
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssr-release-evidence
          path: test-results/ssr-comparison/
          if-no-files-found: warn
          retention-days: 14
