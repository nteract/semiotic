name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library and docs
        run: npm run check:website-build

      - name: Add 404.html for SPA routing
        run: cp docs/build/index.html docs/build/404.html

      - name: Add AI-readable docs (llms.txt, full reference, schema)
        run: |
          cp ai/reference.md docs/build/CLAUDE.md
          cp ai/reference.md docs/build/llms-full.txt
          cp docs/public/llms.txt docs/build/llms.txt
          cp ai/schema.json docs/build/schema.json
          cp ai/system-prompt.md docs/build/api-reference.md
          cp ai/examples.md docs/build/examples.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
