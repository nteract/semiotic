name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like Semiotic to do?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the consumer or use context and the problem this solves. Public descriptions are sufficient; no private repository links or proprietary code are required.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Which high-level props, frameProps, annotations, or custom layouts have you tried? "Not yet attempted" and "no existing workaround" are valid answers.

  - type: textarea
    id: exit-criterion
    attributes:
      label: Observable exit criterion
      description: What concrete behavior or evidence would show this request is satisfied? If replacing a workaround, when could it be removed?
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      description: Where should this capability live?
      options:
        - High-level chart component
        - Stream Frame or renderer
        - Server or export API
        - AI, schema, MCP, or CLI
        - Documentation or examples
        - Other or multiple surfaces
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: API and compatibility expectations
      description:
        Describe proposed props/import paths, existing behavior that must remain
        unchanged, and serialization or tree-shaking constraints.

  - type: textarea
    id: evidence-plan
    attributes:
      label: Evidence plan
      description:
        List applicable Canvas/live SVG/static rendering, dark-theme,
        accessibility, visual-baseline, chart-spec/schema, MCP, and
        golden-example checks. Mark non-applicable surfaces explicitly.
